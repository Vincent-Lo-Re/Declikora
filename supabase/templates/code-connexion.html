<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ton code de connexion à Declikora</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f5f5f5; font-family: Inter, Arial, sans-serif; color: #171717">
    <div style="max-width: 480px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 12px">
      <p style="margin: 0 0 24px; font-size: 14px; font-weight: 600">Declikora</p>
      <h1 style="margin: 0 0 16px; font-size: 20px">Ton code de connexion</h1>
      <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5">
        Saisis ce code dans l'administration de Declikora :
      </p>
      <p
        style="margin: 0 0 24px; font-size: 32px; font-weight: 700; letter-spacing: 8px; font-family: 'SFMono-Regular', Menlo, Consolas, monospace"
      >
        {{ .Token }}
      </p>
      <p style="margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: #525252">
        Ce code est valable 10 minutes. Ne le transmets à personne.
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #525252">
        Si tu n'as pas demandé ce code, ignore cet e-mail : personne ne peut se connecter sans lui.
      </p>
    </div>
  </body>
</html>
