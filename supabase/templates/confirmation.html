<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme ton adresse e-mail pour Declikora</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f5f5f5; font-family: Inter, Arial, sans-serif; color: #171717">
    <div style="max-width: 480px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 12px">
      <p style="margin: 0 0 24px; font-size: 14px; font-weight: 600">Declikora</p>
      <h1 style="margin: 0 0 16px; font-size: 20px">Confirme ton adresse e-mail</h1>
      <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
        Clique sur le bouton ci-dessous pour confirmer ton adresse e-mail.
      </p>
      <p style="margin: 0 0 24px">
        <a
          href="{{ .ConfirmationURL }}"
          style="display: inline-block; padding: 12px 20px; background: #171717; color: #ffffff; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none"
          >Confirmer mon adresse</a
        >
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #525252">
        Si tu n'es pas à l'origine de cette demande, ignore cet e-mail.
      </p>
    </div>
  </body>
</html>
