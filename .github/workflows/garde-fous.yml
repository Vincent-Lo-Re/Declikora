# Garde-fous : lancés à chaque demande de fusion et à chaque envoi sur main.
name: Garde-fous

on:
  pull_request:
  push:
    branches: [main]

# Une demande de fusion ne garde que ses dernières vérifications : un nouvel envoi arrête les
# précédentes. Sur main, on n'arrête jamais une série en cours : Vercel ne met une fusion en
# ligne que si ses propres garde-fous sont verts, et une série arrêtée bloquerait sa mise en
# ligne (arrivé le 28/09/2026 avec deux fusions à quelques secondes d'écart). Les séries de main
# passent alors l'une après l'autre.
concurrency:
  group: garde-fous-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  administration:
    name: Administration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Forme des blocs (docs/ARCHITECTURE-CONTENUS.md, § 2.1) : tout ce qui est tiré de
      # blocks/ (schémas des variantes, empreinte, types, validateurs autonomes, mesures, cas
      # pgTAP, migration du schéma) doit être à jour. Le script vérifie aussi chaque cas partagé
      # avec les validateurs produits. Un fichier nouveau (migration oubliée) compte comme un écart.
      - name: Forme des blocs à jour
        run: |
          npm run blocks:generate
          cd ..
          if [ -n "$(git status --porcelain -- blocks web/src/blocks/generated supabase/migrations supabase/tests/aides/blocs-cas.inc)" ]; then
            git status --short -- blocks web/src/blocks/generated supabase/migrations supabase/tests/aides/blocs-cas.inc
            git diff -- blocks web/src/blocks/generated supabase/tests/aides/blocs-cas.inc | head -200
            echo "::error::Lance « cd web && npm run blocks:generate » et commite le résultat."
            exit 1
          fi
      - name: Mise en forme
        run: npm run format:check
      - name: Relecture du code
        run: npm run lint
      # Rien d'inutile ni de copié (docs/BONNES-PRATIQUES.md, § 2 et 3) : fichiers, exports et
      # dépendances qui ne servent pas (knip), blocs identiques de plus de 10 lignes (jscpd).
      - name: Code inutilisé
        run: npm run lint:dead
      - name: Copier-coller
        run: npm run lint:dup
      - name: Tests
        run: npm test
      - name: Types et construction
        run: npm run build

  # Fonctions serveur « equipe » et « files » (Deno) : mise en forme, lint, types et tests
  # unitaires (règles CORS, validation des demandes, vérification des SVG et des Lottie, travail
  # de « files » avec des doublures). Puis les tests d'intégration de « files » contre un
  # Supabase local : vrais envois vers Storage avec un compte d'équipe en aal2, fonction servie
  # par le runtime local, et un vrai passage de la tâche planifiée « fichiers »
  # (pg_cron → pg_net → files). Les tests de parcours ne peuvent pas vérifier le CORS : en
  # local, la passerelle de Supabase répond elle-même aux requêtes CORS.
  fonctions:
    name: Fonctions serveur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Deno est lancé par npx, dans la même version qu'en local (package.json de la racine).
      - name: Vérifications et tests
        run: npm run functions:test
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Seulement ce que la fonction « files » utilise : base (pg_cron, pg_net), connexion, API,
      # Storage, passerelle et fonctions.
      - name: Démarrage de Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,mailpit,postgres-meta
      - name: Tests d'intégration de la fonction « files »
        run: npm run functions:integration

  base:
    name: Base de données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # `supabase db start` applique aussi les migrations de Storage (et d'Auth) : les tests
      # pgTAP des buckets et des politiques de Storage n'ont pas besoin de plus. pg_cron et
      # pg_net sont dans l'image de la base. Le seed (supabase/seed.sql) est appliqué.
      - name: Démarrage de la base
        run: supabase db start
      - name: Tests pgTAP
        run: supabase test db
      # Le schéma des blocs rangé dans la base (dernière migration générée) est bien celui de
      # blocks/ : son empreinte est comparée à blocks/generated/schema.sha256, sans lire les
      # migrations (§ 2.1).
      - name: Empreinte du schéma des blocs
        run: |
          expected="$(tr -d '[:space:]' < blocks/generated/schema.sha256)"
          actual="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc 'select private.blocks_schema_hash()')"
          echo "attendue : $expected"
          echo "en base  : $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::La base n'a pas le schéma des blocs de blocks/ : lance « cd web && npm run blocks:generate » et commite la migration produite."
            exit 1
          fi
      # Types générés (ADMIN § 9) : ils doivent correspondre aux migrations.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances de l'administration
        working-directory: web
        run: npm ci
      - name: Contrôle des types générés
        working-directory: web
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts

  parcours:
    name: Parcours
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Seulement ce que les parcours utilisent : base (avec pg_cron et pg_net, et le seed qui
      # fait appeler la fonction « files » par la passerelle locale), connexion, API, passerelle,
      # fichiers (Storage), fonctions (« equipe », « files »), e-mails (Mailpit) et Realtime (le
      # verrou de l'éditeur suit edit_locks en direct, étape 4).
      - name: Démarrage de Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Navigateur Chromium
        run: npx playwright install --with-deps --only-shell chromium
      # Les clés du Supabase local sont lues par playwright.config.ts (supabase status).
      - name: Tests de parcours
        run: npm run test:e2e
      - name: Rapport des tests de parcours
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-parcours
          path: web/playwright-report/
          retention-days: 7
